(clic) «Vemos piel y uñas, ¿verdad?»
(clic) «¿Y si os digo que yo puedo ver lo que hay DENTRO de la mano sin tocarla?»`},{id:"lupa",section:1,title:"La lupa mágica",C:Pj,steps:2,notes:`«¡Mirad mi lupa mágica!» Mueve el ratón por la mano y la lupa enseña los huesos (si no lo mueves, se pasea sola).
(clic) ¡Se ven todos los huesos!`},{id:"superpoder",section:1,title:"¡Tengo visión de Rayos X!",C:Ej,steps:1,notes:`«¡Tengo el poder de la visión de Rayos X, como los superhéroes!»

(clic o botón) Se enciende la cámara del portátil con efecto rayos X y los peques se ven en la pantalla.
· Si la cámara no funciona, salen esqueletos bailando. Pruébala antes en Ajustes (tecla S).`},{id:"fotografa",section:2,title:"Fotógrafa de huesos",C:Bj,steps:4,notes:`«Mi trabajo es ser la fotógrafa de los huesos.»
(clic, clic, clic) Cada clic hace una foto de huesos: una mano, un esqueleto y un hueso.`},{id:"patio",section:2,title:"En el patio: ¡ay, mi brazo!",C:Ij,steps:3,notes:`«Cuando nos caemos jugando en el patio…»
(clic) «…y nos duele un brazo…»
(clic) «…el médico necesita saber cómo está el hueso por dentro.»`},{id:"camara",section:2,title:"La cámara gigante y mágica",C:Uj,steps:5,notes:`«Para eso uso una cámara de fotos gigante y mágica.»
(clic) «No hace daño…» (clic) «…no toca el cuerpo…» (clic) «…y no pincha.»
(clic) «Solo hace un ruido divertido: ¡CLACK! y… ¡magia! La foto aparece en mi ordenador.»
· El botón rojo ¡CLACK! repite la foto todas las veces que queráis.`},{id:"adivina",section:3,title:"¡Adivina el esqueleto!",C:s3,steps:1,notes:"«Ahora vamos a jugar. Yo os enseño fotos de huesos y vosotros adivináis de quién son.»"},{id:"mano",section:3,title:"Una mano: ¡a contar dedos!",C:i3,steps:8,notes:`«¿Qué es esto?» (dejar que adivinen)
(clic) «¡Una mano!»
(5 clics) Contamos los dedos de la foto juntos: 1, 2, 3, 4, 5.
(clic) «¿Y vosotros? ¡Contad los vuestros!»`},{id:"perro",section:3,title:"¿Quién es? Un perro",C:o3,steps:2,notes:`«¿De quién son estos huesos?» (dejar que adivinen: tiene cola, cuatro patas…)
(clic o tocar la foto) «¡Un perro! Los animales también tienen huesos.»`},{id:"gato",section:3,title:"¿Quién es? Un gato",C:l3,steps:2,notes:`«¿Y este? Tiene una cola muuuy larga y orejas puntiagudas…»
(clic) «¡Un gato!»`},{id:"pez",section:3,title:"¿Quién es? Un pez",C:a3,steps:2,notes:`«¿Y este? ¡No tiene patas!»
(clic) «¡Un pez! Tiene muchas espinas, que son sus huesos.»`},{id:"osito",section:3,title:"¿Quién es? Un osito (¡sin huesos!)",C:u3,steps:3,notes:`«¿Y esto? Mmm… ¡aquí no se ven huesos!»
(clic) «¡Un osito de peluche!»
(clic) «Los peluches no tienen huesos: solo algodón… ¡y mucho cariño!»`},{id:"galeria",section:3,title:"Tus radiografías",C:f3,steps:({photos:n})=>Math.max(1,n.length*2),skipIf:({photos:n})=>n.length===0,notes:`Tus propias radiografías (las añades en Ajustes, tecla S).
Cada foto: (clic) se muestra la respuesta que escribiste.`},{id:"robot",section:3,title:"El truco final: ¡un robot!",C:c3,steps:3,notes:`EL TRUCO FINAL: «¿Y esto? ¡Qué huesos más raros!»
(clic) «¡Un robot!»
(clic) «Los robots no tienen huesos: ¡tienen engranajes y una pila!»`},{id:"borrosa",section:4,title:"Si te mueves, sale borrosa",C:h3,steps:4,notes:`«Para que la foto de los huesos salga guapa y no salga borrosa…»
(clic) Si nos movemos: ¡CLACK! sale borrosa.
(clic) «…hay que hacer el juego de la estatua.»
(clic) Quietos: ¡CLACK! ¡foto perfecta!`},{id:"estatua",section:4,title:"¡Juego de la estatua!",C:m3,steps:4,notes:`Suena música: ¡a bailar todos! (los peques pueden levantarse)
«¡A la de tres, todos nos convertimos en estatuas de hielo! Una… (clic) dos… (clic) y… ¡TRES!» (clic)
Se congelan 5 segundos, ¡CLACK! y «¡Perfecto! Así es exactamente como me ayudan los niños valientes en el hospital.»
· Si la cámara está encendida, sale una foto de la clase en rayos X. «¡Otra vez!» repite el juego.`},{id:"armadura",section:5,title:"La armadura mágica",C:y3,steps:3,notes:`«A veces, para protegernos de la súper energía de la cámara, nos ponemos una armadura mágica.»
(clic) «¡Es un chaleco que pesa un poco…»
